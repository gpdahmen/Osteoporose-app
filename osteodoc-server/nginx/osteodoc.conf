# OsteoDoc – Nginx-Konfiguration
# HTTPS-Terminierung mit Let's Encrypt, Reverse Proxy zu Node.js

# HTTP → HTTPS Umleitung
server {
    listen 80;
    listen [::]:80;
    server_name osteodoc.example.com;  # Anpassen!

    # Let's Encrypt Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Alles andere → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS-Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name osteodoc.example.com;  # Anpassen!

    # ─── TLS (Let's Encrypt) ────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/osteodoc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osteodoc.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # ─── Sicherheits-Header ─────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy – KEINE externen Ressourcen
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # ─── Statische Dateien ───────────────────────────────────
    root /opt/osteodoc/client/dist;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── API → Node.js ──────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Request-Größe begrenzen
        client_max_body_size 1m;
    }

    # ─── SPA Fallback ────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Logging ─────────────────────────────────────────────
    access_log /opt/osteodoc/logs/nginx-access.log;
    error_log  /opt/osteodoc/logs/nginx-error.log;
}
